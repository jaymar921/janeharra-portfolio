<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gradMauveBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#89b4fa" />
    </linearGradient>
    <linearGradient id="gradBlueTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#94e2d5" />
    </linearGradient>
    <linearGradient id="gradPeachPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fab387" />
      <stop offset="100%" stop-color="#f5c2e7" />
    </linearGradient>
    <linearGradient id="gradTealGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94e2d5" />
      <stop offset="100%" stop-color="#a6e3a1" />
    </linearGradient>
  </defs>

  <!-- depth ring behind headset -->
  <circle cx="1430" cy="300" r="230" fill="none" stroke="url(#gradMauveBlue)" stroke-width="1.5" opacity="0.18" />
  <circle cx="1430" cy="300" r="300" fill="none" stroke="url(#gradMauveBlue)" stroke-width="1" opacity="0.1" />

  <!-- headset -->
  <g opacity="0.5">
    <path d="M1300,330 C1300,190 1560,190 1560,330" fill="none" stroke="url(#gradMauveBlue)" stroke-width="7" stroke-linecap="round" />
    <rect x="1270" y="320" width="52" height="96" rx="22" fill="none" stroke="url(#gradMauveBlue)" stroke-width="7" />
    <rect x="1558" y="320" width="52" height="96" rx="22" fill="none" stroke="url(#gradMauveBlue)" stroke-width="7" />
    <path d="M1296,392 C1316,452 1372,472 1414,466" fill="none" stroke="url(#gradBlueTeal)" stroke-width="6" stroke-linecap="round" />
    <circle cx="1418" cy="466" r="11" fill="url(#gradBlueTeal)" opacity="0.9" />
  </g>

  <!-- call signal waves from mic -->
  <g opacity="0.35">
    <path d="M1450,466 a34,34 0 0 1 0,0" fill="none" />
    <circle cx="1418" cy="466" r="34" fill="none" stroke="url(#gradBlueTeal)" stroke-width="3" stroke-dasharray="4 10" />
    <circle cx="1418" cy="466" r="62" fill="none" stroke="url(#gradBlueTeal)" stroke-width="2.5" stroke-dasharray="4 12" opacity="0.7" />
    <circle cx="1418" cy="466" r="92" fill="none" stroke="url(#gradBlueTeal)" stroke-width="2" stroke-dasharray="3 14" opacity="0.45" />
  </g>

  <!-- chat bubble, bottom-left -->
  <g opacity="0.45">
    <rect x="150" y="700" width="300" height="180" rx="36" fill="none" stroke="url(#gradPeachPink)" stroke-width="7" />
    <path d="M210,878 L175,940 L262,880" fill="none" stroke="url(#gradPeachPink)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="240" cy="788" r="11" fill="url(#gradPeachPink)" />
    <circle cx="300" cy="788" r="11" fill="url(#gradPeachPink)" />
    <circle cx="360" cy="788" r="11" fill="url(#gradPeachPink)" />
  </g>

  <!-- small secondary chat bubble -->
  <g opacity="0.3">
    <rect x="480" y="620" width="150" height="96" rx="22" fill="none" stroke="url(#gradTealGreen)" stroke-width="5" />
    <path d="M520,716 L505,752 L556,718" fill="none" stroke="url(#gradTealGreen)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
  </g>

  <!-- support / resolved badge, bottom-right -->
  <g opacity="0.4">
    <circle cx="1730" cy="880" r="64" fill="none" stroke="url(#gradTealGreen)" stroke-width="6" />
    <path d="M1700,880 L1720,900 L1762,855" fill="none" stroke="url(#gradTealGreen)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- floating connection dots -->
  <g opacity="0.35">
    <circle cx="800" cy="200" r="4" fill="#cba6f7" />
    <circle cx="900" cy="160" r="3" fill="#89b4fa" />
    <circle cx="1020" cy="230" r="3.5" fill="#94e2d5" />
    <circle cx="700" cy="500" r="3" fill="#f5c2e7" />
    <circle cx="1650" cy="600" r="3" fill="#a6e3a1" />
    <circle cx="1550" cy="700" r="4" fill="#89b4fa" />
    <path d="M800,200 C860,190 900,170 900,160" fill="none" stroke="#89b4fa" stroke-width="1" opacity="0.5" />
    <path d="M900,160 C960,190 1000,210 1020,230" fill="none" stroke="#94e2d5" stroke-width="1" opacity="0.5" />
  </g>
</svg>
